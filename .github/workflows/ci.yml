name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # PySpark needs a JVM.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: |
          set -o pipefail
          pytest -v 2>&1 | tee pytest-output.txt

      # Show the end of the pytest output as an annotation on the run summary
      # page, so failures are visible without opening the full log.
      - name: Report test failures
        if: failure()
        run: |
          summary=$(tail -n 60 pytest-output.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=pytest failed::${summary}"
