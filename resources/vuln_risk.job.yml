# Daily job: refresh the pipeline, then (re)apply governance tags.
# Tasks with no cluster definition run on serverless compute.
resources:
  jobs:
    vuln_risk_daily:
      name: vuln-risk-lakehouse-daily
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"   # every day at 07:00
        timezone_id: America/Chicago
        pause_status: UNPAUSED
      tasks:
        # Uncomment to download the source files first (only if your workspace
        # can reach cisa.gov and empiricalsecurity.com - see notebooks/01).
        # - task_key: download_sources
        #   notebook_task:
        #     notebook_path: ../notebooks/01_download_sources.py
        #     base_parameters:
        #       landing_path: ${var.landing_path}

        - task_key: refresh_pipeline
          # depends_on:
          #   - task_key: download_sources
          pipeline_task:
            pipeline_id: ${resources.pipelines.vuln_risk_pipeline.id}
            full_refresh: false

        - task_key: apply_governance_tags
          depends_on:
            - task_key: refresh_pipeline
          notebook_task:
            notebook_path: ../notebooks/02_apply_governance.py
            base_parameters:
              catalog: ${var.catalog}
